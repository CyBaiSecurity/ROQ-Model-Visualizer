<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="ROQ Model Visualizer - Interactive pentesting scenario mapper using the Relationship-Oriented Questioning framework.">
    <title>ROQ Model Visualizer | Pentesting Framework</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header id="app-header">
        <div class="header-left">
            <div class="logo-icon">
                <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
                    <polygon points="14,2 26,8 26,20 14,26 2,20 2,8" stroke="#4fc3f7" stroke-width="1.5" fill="none" />
                    <circle cx="14" cy="14" r="4" fill="#4fc3f7" opacity="0.6" />
                </svg>
            </div>
            <div class="header-title">
                <h1>ROQ Model Visualizer</h1>
                <span class="header-subtitle">Relationship-Oriented Questioning Model</span>
            </div>
        </div>
        <div class="header-controls" id="header-controls">
            <button id="btn-save" class="ctrl-btn ctrl-save" title="Save Scenario">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                    <path d="M13 16H3a2 2 0 01-2-2V2a2 2 0 012-2h8l4 4v10a2 2 0 01-2 2z" stroke="currentColor"
                        stroke-width="1.5" />
                    <path d="M11 16v-5H5v5M5 0v4h5" stroke="currentColor" stroke-width="1.5" />
                </svg>
                <span>Save</span>
            </button>
            <button id="btn-history" class="ctrl-btn ctrl-history" title="Load From History">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                    <circle cx="8" cy="8" r="7" stroke="currentColor" stroke-width="1.5" />
                    <path d="M8 4v4l3 2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
                </svg>
                <span>History</span>
            </button>
            <button id="btn-export" class="ctrl-btn ctrl-export" title="Export as SVG">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                    <path d="M2 11v3h12v-3M8 1v9M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.5"
                        stroke-linecap="round" stroke-linejoin="round" />
                </svg>
                <span>Export</span>
            </button>
            <button id="btn-reset" class="ctrl-btn ctrl-reset" title="Reset All">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                    <path d="M2 2v5h5M14 14v-5H9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
                        stroke-linejoin="round" />
                    <path d="M13.5 6A6 6 0 004 3.5L2 7M2.5 10a6 6 0 009.5 2.5L14 9" stroke="currentColor"
                        stroke-width="1.5" stroke-linecap="round" />
                </svg>
                <span>Reset</span>
            </button>
        </div>
    </header>

    <main id="app-main">
        <aside id="input-panel" class="panel">
            <div class="panel-header">
                <h2>Scenario Inputs</h2>
                <span class="autosave-badge" id="autosave-badge">Auto-saved</span>
            </div>
            <div id="panel-scroll">
                <!-- Node Size Slider -->
                <div id="scale-control">
                    <label for="node-scale-slider">Node Size</label>
                    <input type="range" id="node-scale-slider" min="0.6" max="1.8" step="0.05" value="1">
                    <span id="scale-val">1.0x</span>
                </div>

                <form id="roq-form" autocomplete="off">
                    <div class="form-group" data-node="position">
                        <label for="input-position"><span class="label-dot dot-white"></span>Your Position<span
                                class="required">*</span></label>
                        <input type="text" id="input-position" placeholder='e.g. "Unauthenticated attacker"' required>
                    </div>
                    <div class="form-group" data-node="object">
                        <label for="input-object"><span class="label-dot dot-blue"></span>The Object / Window<span
                                class="required">*</span></label>
                        <input type="text" id="input-object" placeholder='e.g. "Samba server (port 445)"' required>
                    </div>
                    <div class="form-group" data-node="others">
                        <label for="input-others"><span class="label-dot dot-yellow"></span>Others Position(s)</label>
                        <input type="text" id="input-others" placeholder='e.g. "Root account, File system"'>
                    </div>
                    <div class="form-group" data-node="known">
                        <label for="input-known"><span class="label-dot dot-green"></span>Known Methods</label>
                        <input type="text" id="input-known" placeholder='e.g. "Directory traversal, RCE"'>
                    </div>
                    <div class="form-group" data-node="unknown">
                        <label for="input-unknown"><span class="label-dot dot-red"></span>Unknown Methods</label>
                        <input type="text" id="input-unknown" placeholder='e.g. "Privilege escalation"'>
                    </div>
                </form>

                <!-- Connections Section -->
                <div id="connections-section">
                    <div class="section-header">
                        <h2>Connections</h2>
                        <button id="btn-add-conn" class="ctrl-btn ctrl-save" title="Add Connection">+ Add</button>
                    </div>
                    <div id="connections-list"></div>
                </div>

                <!-- Notes -->
                <div id="notes-section">
                    <label for="input-notes" class="notes-label">Notes</label>
                    <textarea id="input-notes" rows="2" placeholder="Optional scenario context..."></textarea>
                </div>
            </div>
        </aside>

        <section id="diagram-panel" class="panel">
            <div class="panel-header">
                <h2>ROQ Diagram</h2>
                <span class="diagram-hint">Add connections to draw arrows</span>
            </div>
            <div id="diagram-container">
                <svg id="roq-svg" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg"></svg>
            </div>
        </section>
    </main>

    <footer id="app-footer">
        <span>ROQ Model Visualizer &mdash; Cybersecurity Learning Tool</span>
        <span id="status-text"></span>
    </footer>

    <!-- History Modal -->
    <div id="history-overlay" class="modal-overlay hidden">
        <div id="history-modal" class="modal">
            <div class="modal-header">
                <h3>Saved Scenarios</h3>
                <button id="modal-close" class="modal-close-btn" title="Close">&times;</button>
            </div>
            <div id="history-list" class="modal-body">
                <p class="empty-history">No saved scenarios yet.</p>
            </div>
        </div>
    </div>

    <!-- Confirm Modal -->
    <div id="confirm-overlay" class="modal-overlay hidden">
        <div id="confirm-modal" class="modal modal-confirm">
            <div class="modal-header">
                <h3 id="confirm-title">Confirm</h3>
            </div>
            <p id="confirm-msg" class="confirm-message"></p>
            <div class="confirm-actions">
                <button id="confirm-cancel" class="ctrl-btn ctrl-reset">Cancel</button>
                <button id="confirm-ok" class="ctrl-btn ctrl-save">Confirm</button>
            </div>
        </div>
    </div>

    <div id="toast-container"></div>
    <script src="app.js"></script>
</body>

</html>
